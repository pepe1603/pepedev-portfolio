<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{mail.reset.title}">Restablece tu contraseña</title>
    <!--/*
        Las clases son la fuente de verdad: MailStyleInliner las expande a style="..." al renderizar,
        porque los clientes de correo ignoran el CSS de la cabecera. Este comentario es de parser,
        asi que no viaja en el correo.
    */-->
    <style>
        .body { margin:0; padding:0; background-color:#f4f4f5; }
        .page { background-color:#f4f4f5; padding:24px 12px; }
        .card { max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e4e4e7; }
        .card__header { background-color:#18181b; color:#ffffff; padding:24px 28px; font-family:Arial,Helvetica,sans-serif; }
        .card__title { margin:0; font-size:20px; font-weight:600; }
        .card__body { padding:28px; font-family:Arial,Helvetica,sans-serif; color:#27272a; font-size:14px; line-height:1.6; }
        .card__footer { background-color:#fafafa; border-top:1px solid #e4e4e7; padding:14px 28px; font-family:Arial,Helvetica,sans-serif; font-size:12px; color:#71717a; }
        .p { margin:0 0 12px; }
        .p--intro { margin:0 0 16px; }
        .p--center { margin:0 0 20px; text-align:center; }
        .muted { font-size:12px; color:#71717a; }
        .btn { display:inline-block; background-color:#18181b; color:#ffffff; text-decoration:none; font-weight:600; padding:12px 24px; border-radius:8px; }
    </style>
</head>
<body class="body">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="page">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="card">
                <tr>
                    <td class="card__header">
                        <h1 class="card__title" th:text="#{mail.reset.title}">Restablece tu contraseña</h1>
                    </td>
                </tr>
                <tr>
                    <td class="card__body">
                        <p class="p--intro" th:text="#{mail.reset.intro}">Recibimos una solicitud para restablecer la contraseña de tu cuenta.</p>
                        <p class="p--center">
                            <a th:href="${resetUrl}" target="_blank" class="btn"
                               th:text="#{mail.reset.button}">Restablecer contraseña</a>
                        </p>
                        <p class="p muted" th:text="#{mail.reset.expires}">Este enlace es de un solo uso y caduca en 30 minutos.</p>
                    </td>
                </tr>
                <tr>
                    <td class="card__footer" th:text="#{mail.reset.footer}">Este es un correo automático — no respondas a este mensaje.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
