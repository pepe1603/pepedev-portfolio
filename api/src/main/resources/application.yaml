spring:
  application:
    name: portfolio-api
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # el schema lo maneja Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Sin esto, un SMTP que acepta la conexión y no contesta deja el hilo colgado para
          # siempre (los defaults de Jakarta Mail son espera indefinida). Con un corte de red
          # que blackholea los paquetes, el login (que envía el aviso) se queda esperando.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never   # /error propio (JsonErrorController): nunca filtrar mensajes internos

management:
  endpoints:
    web:
      exposure:
        include: health,info