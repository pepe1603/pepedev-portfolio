<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{mail.contact.title}">Nuevo mensaje de contacto</title>
    <!--/*
        Las clases son la fuente de verdad: MailStyleInliner las expande a style="..." al renderizar,
        porque los clientes de correo ignoran el CSS de la cabecera. Este comentario es de parser,
        asi que no viaja en el correo.
    */-->
    <style>
        .body { margin:0; padding:0; background-color:#f4f4f5; }
        .page { background-color:#f4f4f5; padding:24px 12px; }
        .card { max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e4e4e7; }
        .card__header { background-color:#18181b; color:#ffffff; padding:24px 28px; font-family:Arial,Helvetica,sans-serif; }
        .card__title { margin:0; font-size:20px; font-weight:600; }
        .card__body { padding:28px; font-family:Arial,Helvetica,sans-serif; color:#27272a; font-size:14px; line-height:1.6; }
        .card__footer { background-color:#fafafa; border-top:1px solid #e4e4e7; padding:14px 28px; font-family:Arial,Helvetica,sans-serif; font-size:12px; color:#71717a; }
        .p--lead { margin:0 0 18px; }
        .p--tight { margin:0 0 6px; }
        .strong { font-weight:600; }
        .normal { font-weight:400; }
        .link { color:#2563eb; }
        .divider { border:none; border-top:1px solid #e4e4e7; margin:18px 0; }
        .box { white-space:pre-wrap; background-color:#fafafa; border:1px solid #e4e4e7; border-radius:8px; padding:14px; }
    </style>
</head>
<body class="body">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="page">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="card">
                <tr>
                    <td class="card__header">
                        <h1 class="card__title" th:text="#{mail.contact.title}">Nuevo mensaje de contacto</h1>
                    </td>
                </tr>
                <tr>
                    <td class="card__body">
                        <p class="p--lead" th:text="#{mail.contact.intro}">Recibiste un nuevo mensaje desde tu portfolio.</p>

                        <p class="p--tight strong">
                            <span th:text="#{mail.contact.de}">De:</span>
                            <span class="normal" th:text="${name}">Nombre</span>
                        </p>
                        <p class="p--tight">
                            <span th:text="#{mail.contact.email}">Email:</span>
                            <a th:href="|mailto:${email}|" class="link" th:text="${email}">email@example.com</a>
                        </p>
                        <p class="p--tight">
                            <span th:text="#{mail.contact.ip}">IP:</span>
                            <span th:text="${ip}">0.0.0.0</span>
                        </p>
                        <p class="p--tight">
                            <span th:text="#{mail.contact.fecha}">Fecha:</span>
                            <span th:text="${fecha}">01/01/2026 00:00</span>
                        </p>
                        <p class="p--tight">
                            <span th:text="#{mail.contact.asunto}">Asunto:</span>
                            <span class="strong" th:text="${subject}">Asunto</span>
                        </p>

                        <hr class="divider"/>
                        <p class="p--tight strong" th:text="#{mail.contact.mensaje}">Mensaje:</p>
                        <div class="box" th:text="${body}">Cuerpo</div>
                    </td>
                </tr>
                <tr>
                    <td class="card__footer" th:text="#{mail.contact.footer}">Notificación automática del formulario de contacto — pepedev-portfolio</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
