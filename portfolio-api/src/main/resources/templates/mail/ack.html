<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{mail.ack.title}">Hemos recibido tu mensaje</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#f4f4f5;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4e7;">
                <tr>
                    <td style="background-color:#18181b;color:#ffffff;padding:24px 28px;font-family:Arial,Helvetica,sans-serif;">
                        <h1 style="margin:0;font-size:20px;font-weight:600;"
                            th:text="#{mail.ack.title}">Hemos recibido tu mensaje</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;font-family:Arial,Helvetica,sans-serif;color:#27272a;font-size:14px;line-height:1.6;">
                        <p style="margin:0 0 12px;">
                            <span th:text="#{mail.ack.hola}">Hola,</span>
                            <span style="font-weight:600;" th:text="${name}">Nombre</span>
                        </p>
                        <p style="margin:0 0 12px;" th:text="#{mail.ack.intro}">Gracias por escribirnos. Tu mensaje ha llegado correctamente.</p>
                        <p style="margin:0 0 12px;" th:text="#{mail.ack.confirm(${subject})}">Hemos recibido tu mensaje con el asunto «…».</p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#fafafa;border-top:1px solid #e4e4e7;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#71717a;"
                        th:text="#{mail.ack.footer}">Este es un correo automático — no respondas a este mensaje.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
